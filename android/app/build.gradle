plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.example.screentosheets'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.screentosheets'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlinOptions {
    jvmTarget = '17'
}
